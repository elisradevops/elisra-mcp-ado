name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Bump version & publish Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ELISRADEVOPS_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Pull latest main before version bump
        run: git pull --rebase origin main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Bump version
        id: bump
        uses: phips28/gh-action-bump-version@master
        env:
          GITHUB_TOKEN: ${{ secrets.ELISRADEVOPS_ACCESS_TOKEN }}
        with:
          tag-prefix: ""
          commit-message: "CI: bumps version to {{version}} [skip ci]"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push MCP server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            elisradevops/elisra-mcp-ado:${{ steps.bump.outputs.newTag }}
            elisradevops/elisra-mcp-ado:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push mcpo bridge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mcpo.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            elisradevops/elisra-mcp-ado-mcpo:${{ steps.bump.outputs.newTag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test mcpo bridge image
        run: |
          docker pull --platform linux/amd64 \
            elisradevops/elisra-mcp-ado-mcpo:${{ steps.bump.outputs.newTag }}
          docker run -d --name mcpo-smoke \
            -e ADO_AUTH_MODE=per_request_pat \
            -e ADO_ORG_URL=https://example.invalid/tfs/Dummy \
            -e MCPO_API_KEY=ci-smoke \
            -p 8000:8000 \
            elisradevops/elisra-mcp-ado-mcpo:${{ steps.bump.outputs.newTag }}
          for i in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer ci-smoke" \
                http://127.0.0.1:8000/openapi.json > /tmp/openapi.json 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [ ! -s /tmp/openapi.json ]; then
            echo "Smoke FAILED: mcpo did not respond on /openapi.json after 60s"
            exit 1
          fi
          jq -e '.paths | type == "object" and (keys | length) > 0' /tmp/openapi.json

      - name: Cleanup smoke container
        if: always()
        run: |
          docker logs mcpo-smoke 2>&1 || true
          docker rm -f mcpo-smoke 2>/dev/null || true

      - name: Promote both images to :latest
        run: |
          docker buildx imagetools create \
            --tag elisradevops/elisra-mcp-ado:latest \
            elisradevops/elisra-mcp-ado:${{ steps.bump.outputs.newTag }}
          docker buildx imagetools create \
            --tag elisradevops/elisra-mcp-ado-mcpo:latest \
            elisradevops/elisra-mcp-ado-mcpo:${{ steps.bump.outputs.newTag }}
